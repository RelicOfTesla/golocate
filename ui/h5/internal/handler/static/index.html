<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="appTitle">golocate - 快速文件搜索</title>
    <style>
        /* ============ Design tokens ============ */
        :root {
            --bg: #0f1117;
            --bg-grad-1: #12151d;
            --bg-grad-2: #0b0d12;
            --panel: #1a1e28;
            --panel-2: #20242f;
            --border: #272d3a;
            --border-soft: #1f2531;
            --text: #e7eaf2;
            --text-2: #9aa3b5;
            --text-3: #6b7485;
            --accent: #34d399;
            --accent-2: #2dd4bf;
            --accent-soft: rgba(52, 211, 153, 0.12);
            --accent-border: rgba(52, 211, 153, 0.35);
            --danger: #f87171;
            --warning: #fbbf24;
            --radius: 14px;
            --radius-sm: 9px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.25);
            --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: var(--accent-soft); color: var(--text); }
        body {
            font-family: var(--font);
            background: radial-gradient(1200px 500px at 50% -10%, var(--bg-grad-1), transparent 60%), var(--bg-grad-2);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }
        .container { max-width: 1440px; margin: 0 auto; padding: 22px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2c3342; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background: #3a4254; background-clip: padding-box; border: 2px solid transparent; }

        /* ============ Header ============ */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            gap: 16px; flex-wrap: wrap;
            margin-bottom: 22px; padding: 14px 18px;
            border-radius: var(--radius);
            background: rgba(26, 30, 40, 0.72);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: var(--shadow-sm);
        }
        .header h1 {
            font-size: 22px; font-weight: 700; letter-spacing: 0.2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }
        .header-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

        /* ============ Buttons ============ */
        button {
            font-family: var(--font);
            padding: 10px 18px;
            border: none; cursor: pointer;
            border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600;
            color: #06251c;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 4px 14px rgba(52, 211, 153, 0.28);
            transition: transform 0.12s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }
        button:hover { filter: brightness(1.08); box-shadow: 0 6px 20px rgba(52, 211, 153, 0.38); }
        button:active { transform: translateY(1px) scale(0.99); }
        button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
        button.secondary {
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            box-shadow: none;
        }
        button.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        /* ============ Search Box ============ */
        .search-box { display: flex; gap: 12px; margin-bottom: 16px; }
        .search-box input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            font-size: 17px;
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
            background: rgba(26, 30, 40, 0.85);
            color: var(--text);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .search-box input[type="text"]::placeholder { color: var(--text-3); }
        .search-box input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft), inset 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        /* Generic inputs */
        input[type="text"], input[type="number"], select, textarea {
            font-family: var(--font);
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: rgba(26, 30, 40, 0.85);
            color: var(--text);
            padding: 9px 12px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
        select { cursor: pointer; }

        /* ============ Advanced Options (chips) ============ */
        .advanced-options {
            display: flex; gap: 10px; margin-bottom: 16px;
            flex-wrap: wrap; align-items: center;
        }
        .advanced-options label {
            display: inline-flex; align-items: center; gap: 7px;
            cursor: pointer; font-size: 13px; color: var(--text-2);
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid var(--border-soft);
            padding: 7px 12px;
            border-radius: 999px;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .advanced-options label:hover { border-color: var(--accent-border); background: rgba(255, 255, 255, 0.07); }
        .advanced-options input[type="number"] { width: 78px; padding: 5px 8px; }
        .advanced-options input[type="text"] { width: auto; padding: 5px 9px; font-size: 13px; }
        .advanced-options select { padding: 5px 8px; font-size: 13px; }

        /* ============ Search History ============ */
        .search-history { margin-bottom: 16px; }
        .search-history-title { color: var(--text-3); font-size: 0.85em; margin-bottom: 6px; letter-spacing: 0.3px; }
        .search-history-items { display: flex; gap: 8px; flex-wrap: wrap; }
        .search-history-item {
            padding: 5px 13px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-soft);
            border-radius: 999px;
            font-size: 0.82em; cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .search-history-item:hover { border-color: var(--accent-border); background: rgba(255, 255, 255, 0.1); }

        /* ============ Results Header ============ */
        .results-header {
            display: flex; justify-content: space-between; align-items: center;
            gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
        }
        .results-count { color: var(--text-2); font-size: 14px; }
        .export-buttons { display: flex; gap: 8px; }
        .export-buttons button { padding: 7px 14px; font-size: 0.8em; }

        /* ============ Results Table ============ */
        .results-table-container {
            background: rgba(26, 30, 40, 0.8);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        table.results-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        table.results-table thead {
            background: rgba(32, 37, 48, 0.92);
            backdrop-filter: blur(8px);
            position: sticky; top: 0; z-index: 5;
        }
        table.results-table th {
            padding: 13px 12px; text-align: left;
            font-weight: 600; font-size: 13px; letter-spacing: 0.3px;
            color: var(--text-2);
            cursor: pointer; user-select: none;
            border-bottom: 1.5px solid var(--border);
            transition: background 0.15s ease, color 0.15s ease;
        }
        table.results-table th:hover { background: rgba(255, 255, 255, 0.04); color: var(--text); }
        table.results-table th.sortable::after { content: ' ⇅'; color: var(--text-3); font-size: 12px; }
        table.results-table th.sort-asc::after { content: ' ↑'; color: var(--accent); }
        table.results-table th.sort-desc::after { content: ' ↓'; color: var(--accent); }

        /* Column widths */
        table.results-table th.col-name { width: 17%; }
        table.results-table th.col-path { width: 31%; }
        table.results-table th.col-size { width: 9%; }
        table.results-table th.col-modtime { width: 12%; }
        table.results-table th.col-match { width: 20%; }
        table.results-table th.col-actions { width: 11%; }

        table.results-table td {
            padding: 11px 12px;
            border-bottom: 1px solid var(--border-soft);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-size: 13.5px;
        }
        table.results-table tbody tr {
            transition: background 0.14s ease;
            cursor: default;
            position: relative;
        }
        table.results-table tbody tr:hover { background: rgba(52, 211, 153, 0.05); }
        table.results-table tbody tr::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: linear-gradient(var(--accent), transparent);
            opacity: 0; transition: opacity 0.15s ease;
        }
        table.results-table tbody tr:hover::before { opacity: 1; }
        table.results-table tbody tr:last-child td { border-bottom: none; }

        td.col-name { color: var(--text); font-weight: 550; }
        td.col-path { color: var(--accent); font-family: var(--mono); font-size: 12.5px; }
        td.col-path:hover { text-decoration: underline; text-underline-offset: 3px; }
        td.col-size { color: var(--text-2); font-size: 12.5px; text-align: right; }
        td.col-modtime { color: var(--text-2); font-size: 12.5px; }
        td.col-match { color: var(--text-2); font-size: 12.5px; }
        td.col-match mark {
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent-border);
            border-radius: 4px; padding: 0 3px; font-weight: 600;
        }

        /* Row action buttons */
        td.col-actions button {
            padding: 4px 9px; font-size: 0.75em; margin: 1px 2px;
            color: var(--text-2);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-soft);
            box-shadow: none;
        }
        td.col-actions button:hover {
            color: var(--accent);
            border-color: var(--accent-border);
            background: var(--accent-soft);
            filter: none;
        }

        /* ============ Pagination ============ */
        .pagination {
            display: flex; justify-content: center; align-items: center;
            gap: 10px; margin: 18px 0; flex-wrap: wrap;
        }
        .pagination button { padding: 7px 16px; font-size: 13px; }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; filter: none; }
        .pagination span { color: var(--text-2); font-size: 14px; }
        .pagination label { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
        .pagination input { width: 62px; padding: 6px 8px; text-align: center; }

        /* ============ Empty / Status / Error ============ */
        .empty-state {
            padding: 56px 20px; text-align: center;
            color: var(--text-3); font-size: 15px;
        }
        .status { color: var(--text-2); font-size: 0.9em; padding: 24px; text-align: center; }
        .error { color: var(--danger); padding: 24px; text-align: center; font-weight: 500; }

        /* ============ Status Bar ============ */
        .status-bar {
            display: flex; align-items: center; gap: 12px;
            background: rgba(26, 30, 40, 0.8);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 18px; margin-bottom: 16px;
            font-size: 13px; color: var(--text-2);
            flex-wrap: wrap;
            box-shadow: var(--shadow-sm);
        }
        .status-bar .dot {
            width: 10px; height: 10px; border-radius: 50%;
            display: inline-block; flex-shrink: 0;
        }
        .status-bar .dot.on { background: var(--accent); box-shadow: 0 0 8px rgba(52, 211, 153, 0.7); }
        .status-bar .dot.off { background: var(--danger); box-shadow: 0 0 8px rgba(248, 113, 113, 0.6); }
        .status-bar .dot.building { background: var(--warning); animation: pulse 1.1s ease-in-out infinite; box-shadow: 0 0 8px rgba(251, 191, 36, 0.6); }
        @keyframes pulse { 50% { opacity: 0.3; transform: scale(0.8); } }
        .status-bar .stat { display: inline-flex; align-items: center; gap: 6px; }
        .status-bar .stat b { color: var(--text); font-weight: 600; }

        /* ============ Panels (settings / favorites) ============ */
        .settings-panel {
            display: none;
            background: rgba(26, 30, 40, 0.85);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px; margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .settings-panel h3 {
            margin-bottom: 14px; font-size: 15px; font-weight: 600;
            color: var(--accent);
            display: flex; align-items: center; gap: 8px;
        }
        .settings-panel h3::before {
            content: ''; width: 4px; height: 16px; border-radius: 2px;
            background: linear-gradient(var(--accent), var(--accent-2));
        }
        .settings-panel label {
            display: flex; justify-content: space-between; align-items: center;
            gap: 10px; margin-bottom: 10px; font-size: 13.5px; color: var(--text-2);
        }
        .settings-panel input, .settings-panel select { padding: 6px 10px; }
        .settings-panel textarea {
            background: rgba(15, 17, 23, 0.8);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-family: var(--mono); font-size: 12px; width: 100%;
        }

        /* Generated rows inside panels (favorites/recent/dirList) — override
           the inline styles the JS sets, so both themes look consistent. */
        #favList div, #recentList div, #dirList div {
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid var(--border-soft) !important;
            border-radius: 10px !important;
        }
        #favList button, #recentList button, #dirList button {
            padding: 3px 10px !important; font-size: 0.78em !important;
            background: rgba(255, 255, 255, 0.06) !important;
            border: 1px solid var(--border-soft) !important;
            color: var(--text-2) !important;
            box-shadow: none !important;
        }
        #favList button:hover, #recentList button:hover, #dirList button:hover {
            color: var(--danger) !important;
            border-color: var(--danger) !important;
        }
        #favList span, #recentList span, #dirList span { color: var(--text-2); }

        /* ============ Responsive ============ */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .header { padding: 12px 14px; }
            .header h1 { font-size: 19px; }
            .search-box input[type="text"] { font-size: 15px; padding: 13px 16px; }
            table.results-table th, table.results-table td { padding: 8px 6px; font-size: 12px; }
            .advanced-options { flex-direction: column; align-items: stretch; }
            .advanced-options label { justify-content: space-between; }
        }

        /* ============ Light theme ============ */
        body.light-theme {
            --bg: #eef1f7;
            --bg-grad-1: #f7f9fd;
            --bg-grad-2: #e8ebf2;
            --panel: #ffffff;
            --panel-2: #f5f7fb;
            --border: #d9deea;
            --border-soft: #e6eaf2;
            --text: #1d2433;
            --text-2: #5a6478;
            --text-3: #98a2b6;
            --accent: #0f9d6e;
            --accent-2: #0e9b8c;
            --accent-soft: rgba(15, 157, 110, 0.1);
            --accent-border: rgba(15, 157, 110, 0.3);
            --danger: #d64545;
            --warning: #d97706;
            --shadow: 0 10px 30px rgba(30, 40, 60, 0.12);
            --shadow-sm: 0 4px 14px rgba(30, 40, 60, 0.08);
            background: radial-gradient(1200px 500px at 50% -10%, var(--bg-grad-1), transparent 60%), var(--bg-grad-2);
            color: var(--text);
        }
        body.light-theme .header,
        body.light-theme .results-table-container,
        body.light-theme .status-bar,
        body.light-theme .settings-panel {
            background: rgba(255, 255, 255, 0.85);
            border-color: var(--border);
        }
        body.light-theme button.secondary,
        body.light-theme .search-history-item,
        body.light-theme .advanced-options label {
            background: rgba(15, 23, 42, 0.04);
            border-color: var(--border);
            color: var(--text-2);
        }
        body.light-theme .search-box input[type="text"],
        body.light-theme input[type="text"],
        body.light-theme input[type="number"],
        body.light-theme select,
        body.light-theme textarea {
            background: #fff;
            color: var(--text);
            border-color: var(--border);
        }
        body.light-theme table.results-table thead { background: rgba(245, 247, 251, 0.94); }
        body.light-theme table.results-table th { color: var(--text-2); border-bottom-color: var(--border); }
        body.light-theme table.results-table td { color: var(--text); border-bottom-color: var(--border-soft); }
        body.light-theme table.results-table tbody tr:hover { background: rgba(15, 157, 110, 0.06); }
        body.light-theme td.col-path { color: var(--accent); }
        body.light-theme td.col-match mark { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
        body.light-theme td.col-actions button,
        body.light-theme #favList button, body.light-theme #recentList button, body.light-theme #dirList button {
            background: rgba(15, 23, 42, 0.05);
            border-color: var(--border);
            color: var(--text-2);
        }
        body.light-theme ::-webkit-scrollbar-thumb { background: #c3cad9; background-clip: padding-box; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🔍 <span data-i18n="appTitle">golocate - 快速文件搜索</span></h1>
            <div class="header-buttons">
                <button class="secondary" onclick="toggleLang()" id="langBtn">🌐 EN</button>
                <button class="secondary" onclick="toggleFavPanel()" id="favBtn">⭐ <span data-i18n="favorites">收藏</span></button>
                <button class="secondary" onclick="refreshStatus()" data-i18n="btnStatus">📊 状态</button>
                <button class="secondary" onclick="rebuildIndex()" data-i18n="btnRebuild">🔄 重建索引</button>
                <button class="secondary" onclick="toggleSettings()" data-i18n="btnSettings">⚙️ 设置</button>
            </div>
        </div>
        
        <!-- Server Status -->
        <div class="status-bar" id="statusBar" style="display: none;">
            <span id="statusText"></span>
        </div>
        
        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <h3 data-i18n="settingsTitle">设置</h3>
            <label>
                <span data-i18n="labelDefaultLimit">默认最大结果数:</span>
                <input type="number" id="defaultLimit" value="100" min="1" max="10000" style="width: 100px;">
            </label>
            <label>
                <span data-i18n="labelDefaultIgnoreCase">默认忽略大小写:</span>
                <input type="checkbox" id="defaultIgnoreCase" checked>
            </label>
            <label>
                <span data-i18n="labelTheme">主题:</span>
                <select id="themeSelect" style="width: 100px;">
                    <option value="dark">暗色</option>
                    <option value="light">亮色</option>
                </select>
            </label>
            <label>
                <span data-i18n="labelDebounce">搜索防抖延迟(ms):</span>
                <input type="number" id="debounceDelay" value="300" min="100" max="10000" step="100" style="width: 100px;">
            </label>
            <button onclick="saveSettings()" style="margin-top: 10px;" data-i18n="btnSaveSettings">保存设置</button>
            <hr style="border-color:#444; margin:10px 0;">
            <h3 data-i18n="dirMgmtTitle">索引目录管理</h3>
            <div id="dirList" style="margin-bottom:8px;"></div>
            <div style="display:flex; gap:6px;">
                <input type="text" id="newDirInput" placeholder="/home/user/projects" style="flex:1;" data-i18n-placeholder="dirInputPlaceholder">
                <button onclick="addDir()" style="padding:6px 12px;" data-i18n="btnAddDir">添加</button>
                <button onclick="applyDirsToConfig()" class="secondary" style="padding:6px 12px;" data-i18n="btnApplyDirs">应用到配置</button>
            </div>
            <div style="color:#888; font-size:0.8em; margin-top:4px;" data-i18n="dirMgmtHint">「应用到配置」会把上面的目录列表写进下方配置的 directories，再点「保存配置」生效。</div>
            <hr style="border-color:#444; margin:10px 0;">
            <h3 data-i18n="serverConfigTitle">服务器配置</h3>
            <button onclick="loadServerConfig()" style="margin-bottom: 5px;" data-i18n="btnLoadConfig">加载配置</button>
            <textarea id="serverConfigArea" rows="10" style="width:100%; background:#1a1a1a; color:#e0e0e0; border:1px solid #333; font-family:monospace; font-size:12px; resize:vertical;" placeholder="点击「加载配置」读取当前配置，编辑后点「保存配置」" data-i18n-placeholder="cfgAreaPlaceholder"></textarea>
            <button onclick="saveServerConfig()" style="margin-top: 5px;" data-i18n="btnSaveConfig">保存配置</button>
        </div>
        
        <!-- Favorites Panel -->
        <div class="settings-panel" id="favPanel" style="display:none;">
            <h3 data-i18n="favorites">收藏</h3>
            <div id="favList"></div>
            <h3 style="margin-top:12px;" data-i18n="recent">最近打开</h3>
            <div id="recentList"></div>
        </div>
        
        <!-- Search Box -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索文件..." autofocus data-i18n-placeholder="searchPlaceholder">
            <button onclick="search()" data-i18n="btnSearch">搜索</button>
        </div>
        
        <!-- Advanced Options -->
        <div class="advanced-options">
            <label>
                <input type="checkbox" id="ignoreCase" checked> <span data-i18n="labelIgnoreCase">忽略大小写</span>
            </label>
            <label>
                <input type="checkbox" id="basenameMode"> <span data-i18n="labelBasename">仅文件名</span>
            </label>
            <label>
                <span data-i18n="labelMode">模式:</span>
                <select id="patternMode" style="width: 100px; background:#2a2a2a; color:#e0e0e0; border:1px solid #333; border-radius:4px; padding:5px;">
                    <option value="" data-i18n="modeNormal">普通</option>
                    <option value="regex" data-i18n="modeRegex">正则</option>
                    <option value="wildcard" data-i18n="modeWildcard">通配符</option>
                    <option value="terms" data-i18n="modeTerms">多词(terms)</option>
                </select>
            </label>
            <label>
                <input type="checkbox" id="regexMode"> <span data-i18n="labelRegex">正则表达式</span>
            </label>
            <label>
                <input type="checkbox" id="contentMode"> <span data-i18n="labelContent">内容搜索</span>
            </label>
            <label>
                <input type="checkbox" id="dedupeMode"> <span data-i18n="labelDedupe">去重（硬链接）</span>
            </label>
            <label>
                <span data-i18n="labelScope">目录范围:</span>
                <input type="text" id="scopeInput" placeholder="/home/user/proj" style="width:140px;">
            </label>
            <label>
                <span data-i18n="labelTypes">类型:</span>
                <input type="text" id="typeInput" placeholder="go,md" style="width:80px;">
            </label>
            <label>
                <span data-i18n="labelExclude">排除:</span>
                <input type="text" id="excludeInput" placeholder="*_test.go" style="width:100px;">
            </label>
            <label>
                <span data-i18n="labelMinSize">最小大小(B):</span>
                <input type="number" id="minSizeInput" min="0" style="width:70px;">
            </label>
            <label>
                <span data-i18n="labelMaxSize">最大大小(B):</span>
                <input type="number" id="maxSizeInput" min="0" style="width:70px;">
            </label>
            <label>
                <span data-i18n="labelMaxResults">最大结果数:</span> <input type="number" id="maxResults" value="100" min="1" max="10000">
            </label>
        </div>
        
        <!-- Search History -->
        <div class="search-history" id="searchHistoryContainer" style="display: none;">
            <div class="search-history-title">最近搜索:</div>
            <div class="search-history-items" id="searchHistoryItems"></div>
        </div>
        
        <!-- Results Header -->
        <div class="results-header">
            <div class="results-count" id="resultsCount"></div>
            <div class="export-buttons" id="exportButtons" style="display: none;">
                <button onclick="exportResults('json')" data-i18n="exportJson">导出 JSON</button>
                <button onclick="exportResults('csv')" data-i18n="exportCsv">导出 CSV</button>
                <button onclick="exportResults('txt')" data-i18n="exportTxt">导出 TXT</button>
            </div>
        </div>
        
        <!-- Results Table -->
        <div class="results-table-container" id="resultsContainer">
            <table class="results-table" id="resultsTable">
                <thead>
                    <tr>
                        <th class="col-name sortable" data-sort="Name" data-i18n="thName">文件名</th>
                        <th class="col-path sortable" data-sort="Path" data-i18n="thPath">路径</th>
                        <th class="col-size sortable" data-sort="Size" data-i18n="thSize">大小</th>
                        <th class="col-modtime sortable" data-sort="ModTime" data-i18n="thMtime">修改时间</th>
                        <th class="col-match" data-i18n="thMatch">匹配内容</th>
                        <th class="col-actions" data-i18n="thActions">操作</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <tr><td colspan="6" class="empty-state" data-i18n="emptyStart">开始输入以搜索...</td></tr>
                </tbody>
            </table>
        </div>
        
        <!-- Pagination -->
        <div class="pagination" id="paginationControls" style="display: none;">
            <button id="firstPageBtn" onclick="goFirstPage()" data-i18n="firstPage">首页</button>
            <button id="prevPageBtn" onclick="prevPage()" data-i18n="prevPage">上一页</button>
            <span id="pageInfo">第 1/1 页</span>
            <button id="nextPageBtn" onclick="nextPage()" data-i18n="nextPage">下一页</button>
            <button id="lastPageBtn" onclick="goLastPage()" data-i18n="lastPage">末页</button>
            <label>
                跳转 <input type="number" id="pageJump" min="1" style="width: 60px;">
            </label>
            <button onclick="jumpToPage()" data-i18n="goBtn">GO</button>
        </div>
    </div>
    
    <script>

        // ================= i18n (zh/en) =================
        const I18N_ZH = {
            appTitle: 'golocate - 快速文件搜索', btnSearch: '搜索', btnStatus: '📊 状态',
            btnRebuild: '🔄 重建索引', btnSettings: '⚙️ 设置',
            settingsTitle: '设置', labelDefaultLimit: '默认最大结果数:', labelDefaultIgnoreCase: '默认忽略大小写:',
            labelTheme: '主题:', labelDebounce: '搜索防抖延迟(ms):', btnSaveSettings: '保存设置',
            dirMgmtTitle: '索引目录管理', btnAddDir: '添加', btnApplyDirs: '应用到配置',
            dirInputPlaceholder: '/home/user/projects', dirMgmtHint: '「应用到配置」会把上面的目录列表写进下方配置的 directories，再点「保存配置」生效。',
            serverConfigTitle: '服务器配置', btnLoadConfig: '加载配置', btnSaveConfig: '保存配置',
            cfgAreaPlaceholder: '点击「加载配置」读取当前配置，编辑后点「保存配置」',
            searchPlaceholder: '搜索文件...', labelIgnoreCase: '忽略大小写', labelBasename: '仅文件名',
            labelMode: '模式:', modeNormal: '普通', modeRegex: '正则', modeWildcard: '通配符',
            labelRegex: '正则表达式', labelContent: '内容搜索', labelDedupe: '去重（硬链接）', labelScope: '目录范围:', labelTypes: '类型:', labelExclude: '排除:', labelMinSize: '最小大小(B):', labelMaxSize: '最大大小(B):', modeTerms: '多词(terms)', labelMaxResults: '最大结果数:',
            exportJson: '导出 JSON', exportCsv: '导出 CSV', exportTxt: '导出 TXT',
            thName: '文件名', thPath: '路径', thSize: '大小', thMtime: '修改时间', thMatch: '匹配内容', thActions: '操作',
            emptyStart: '开始输入以搜索...', firstPage: '首页', prevPage: '上一页', nextPage: '下一页',
            lastPage: '末页', goBtn: 'GO', pageJump: '跳转',
            offline: '服务器离线', statusFail: '获取状态失败', statusBuilding: '（构建中', statusScanned: '，已扫描',
            statusRunning: '运行', statusIndexFiles: '索引文件', statusIndexed: '已索引',
            statusLastBuild: '上次构建', statusUptime: '运行时长', yes: '是', no: '否',
            searching: '搜索中...', noResults: '未找到结果', errPrefix: '错误',
            resultsFound: '找到', resultsTotal: '个结果（共', linePrefix: '行',
            noDirs: '暂无索引目录', pageInfo: '第', open: '打开', openDir: '打开目录', noDirToOpen: '无目录可打开', openFail: '打开失败', opened: '已打开', copy: '复制', delete: '删除', favorites: '收藏', favorite: '收藏', noFavorites: '暂无收藏', recent: '最近打开', noRecent: '暂无最近打开',
        };
        const I18N_EN = {
            appTitle: 'golocate - Fast File Search', btnSearch: 'Search', btnStatus: '📊 Status',
            btnRebuild: '🔄 Rebuild', btnSettings: '⚙️ Settings',
            settingsTitle: 'Settings', labelDefaultLimit: 'Default max results:', labelDefaultIgnoreCase: 'Ignore case by default:',
            labelTheme: 'Theme:', labelDebounce: 'Debounce delay (ms):', btnSaveSettings: 'Save settings',
            dirMgmtTitle: 'Index directories', btnAddDir: 'Add', btnApplyDirs: 'Apply to config',
            dirInputPlaceholder: '/home/user/projects', dirMgmtHint: '"Apply to config" writes the directory list into the directories: section below; then click "Save config" to apply it.',
            serverConfigTitle: 'Server config', btnLoadConfig: 'Load config', btnSaveConfig: 'Save config',
            cfgAreaPlaceholder: 'Click "Load config" to read the current config, edit, then "Save config"',
            searchPlaceholder: 'Search files...', labelIgnoreCase: 'Ignore case', labelBasename: 'File name only',
            labelMode: 'Mode:', modeNormal: 'Normal', modeRegex: 'Regex', modeWildcard: 'Wildcard',
            labelRegex: 'Regex', labelContent: 'Content search', labelDedupe: 'Dedupe (hard links)', labelScope: 'Scope:', labelTypes: 'Types:', labelExclude: 'Exclude:', labelMinSize: 'Min size (B):', labelMaxSize: 'Max size (B):', modeTerms: 'Terms', labelMaxResults: 'Max results:',
            exportJson: 'Export JSON', exportCsv: 'Export CSV', exportTxt: 'Export TXT',
            thName: 'Name', thPath: 'Path', thSize: 'Size', thMtime: 'Modified', thMatch: 'Match', thActions: 'Actions',
            emptyStart: 'Type to search...', firstPage: 'First', prevPage: 'Prev', nextPage: 'Next',
            lastPage: 'Last', goBtn: 'GO', pageJump: 'Jump',
            offline: 'Server offline', statusFail: 'Failed to fetch status', statusBuilding: ' (building', statusScanned: ', scanned',
            statusRunning: 'Running', statusIndexFiles: 'Index files', statusIndexed: 'Indexed',
            statusLastBuild: 'Last build', statusUptime: 'Uptime', yes: 'yes', no: 'no',
            searching: 'Searching...', noResults: 'No results', errPrefix: 'Error',
            resultsFound: 'Found', resultsTotal: 'results (of', linePrefix: 'L',
            noDirs: 'No index directories', pageInfo: 'Page', open: 'Open', openDir: 'Open dir', noDirToOpen: 'No directory to open', openFail: 'Open failed', opened: 'Opened', copy: 'Copy', delete: 'Delete', favorites: 'Favorites', favorite: 'Favorite', noFavorites: 'No favorites yet', recent: 'Recently opened', noRecent: 'No recent files',
        };
        let currentLang = localStorage.getItem('golocateLang') || 'zh';
        function t(key) {
            const dict = currentLang === 'zh' ? I18N_ZH : I18N_EN;
            return dict[key] !== undefined ? dict[key] : (I18N_ZH[key] !== undefined ? I18N_ZH[key] : key);
        }
        function applyLang() {
            const dict = currentLang === 'zh' ? I18N_ZH : I18N_EN;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.dataset.i18n;
                if (dict[k] !== undefined) el.textContent = dict[k];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const k = el.dataset.i18nPlaceholder;
                if (dict[k] !== undefined) el.placeholder = dict[k];
            });
            const langBtn = document.getElementById('langBtn');
            if (langBtn) langBtn.textContent = currentLang === 'zh' ? '🌐 EN' : '🌐 中文';
            document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
        }
        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('golocateLang', currentLang);
            applyLang();
            refreshStatus(); // status bar strings are translated dynamically
        }
        // ================= end i18n =================
        
        const searchInput = document.getElementById('searchInput');
        const resultsBody = document.getElementById('resultsBody');
        const resultsCount = document.getElementById('resultsCount');
        const exportButtons = document.getElementById('exportButtons');
        const searchHistoryContainer = document.getElementById('searchHistoryContainer');
        const searchHistoryItems = document.getElementById('searchHistoryItems');
        
        let debounceTimer = null;
        let debounceDelay = 300; // 按键防抖延迟(ms)，可在设置中调整
        let currentResults = [];
        let currentMatches = [];
        let currentSort = { field: null, display: null, direction: 'asc' };
        let currentPage = 1;
        let lastQuery = '';
        let currentTotal = 0;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            applyLang();
            loadFavorites();
            saveFavorites();
            loadSearchHistory();
            loadSettings();
            initSortHandlers();
            refreshStatus();
        });
        
        // Server Status & Index Rebuild
        async function refreshStatus() {
            const bar = document.getElementById('statusBar');
            const text = document.getElementById('statusText');
            try {
                const r = await fetch('/api/status');
                const data = await r.json();
                bar.style.display = 'flex';
                if (data.error) {
                    bar.innerHTML = '<span class="dot off"></span><span>' + t('offline') + ': ' + escapeHtml(data.error) + '</span>';
                    return;
                }
                const dotClass = data.is_building ? 'building' : (data.running ? 'on' : 'off');
                let building = data.is_building ? t('statusBuilding') : '';
                if (data.is_building) {
                    if (data.build_scanned) building += t('statusScanned') + ' ' + data.build_scanned;
                    building += '...';
                }
                text.innerHTML = '<span class="dot ' + dotClass + '"></span>' +
                    '<span class="stat">' + t('statusRunning') + ': <b>' + (data.running ? t('yes') : t('no')) + '</b></span>' +
                    '<span class="stat">' + t('statusIndexFiles') + ': <b>' + (data.index_size || 0) + '</b></span>' +
                    '<span class="stat">' + t('statusIndexed') + ': <b>' + (data.indexed_file_count || 0) + '</b></span>' +
                    '<span class="stat">' + t('statusLastBuild') + ': <b>' + escapeHtml(data.last_build_time ? data.last_build_time.replace('T', ' ').slice(0, 19) : '-') + '</b></span>' +
                    '<span class="stat">' + t('statusUptime') + ': <b>' + escapeHtml(data.uptime || '-') + '</b></span>' + building;
            } catch (err) {
                bar.style.display = 'flex';
                bar.innerHTML = '<span class="dot off"></span><span>' + t('statusFail') + ': ' + escapeHtml(err.message) + '</span>';
            }
        }
        
        async function rebuildIndex() {
            try {
                const r = await fetch('/api/build', { method: 'POST' });
                const data = await r.json();
                if (data.status === 'build started') {
                    alert('索引重建已开始');
                    setTimeout(refreshStatus, 1000);
                } else {
                    alert('重建失败: ' + (data.error || r.statusText));
                }
            } catch (err) {
                alert('重建失败: ' + err.message);
            }
        }
        
        // Settings Functions
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }
        
        function saveSettings() {
            const settings = {
                defaultLimit: document.getElementById('defaultLimit').value,
                defaultIgnoreCase: document.getElementById('defaultIgnoreCase').checked,
                theme: document.getElementById('themeSelect').value,
                debounceDelay: document.getElementById('debounceDelay').value
            };
            localStorage.setItem('golocateSettings', JSON.stringify(settings));
            alert('设置已保存');
            applySettings(settings);
        }
        
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('golocateSettings') || '{}');
            if (settings.defaultLimit) {
                document.getElementById('defaultLimit').value = settings.defaultLimit;
                document.getElementById('maxResults').value = settings.defaultLimit;
            }
            if (settings.defaultIgnoreCase !== undefined) {
                document.getElementById('defaultIgnoreCase').checked = settings.defaultIgnoreCase;
                document.getElementById('ignoreCase').checked = settings.defaultIgnoreCase;
            }
            if (settings.theme) {
                document.getElementById('themeSelect').value = settings.theme;
                applySettings(settings);
            }
            if (settings.debounceDelay) {
                document.getElementById('debounceDelay').value = settings.debounceDelay;
                debounceDelay = parseInt(settings.debounceDelay) || 2500;
            }
        }
        
        function applySettings(settings) {
            if (settings.theme === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
        }
        
        // Sort Functions
        // Header clicks re-run the search with server-side sort parameters,
        // so sorting applies across the full result set, not just the page.
        const SORT_FIELD_MAP = { Name: 'name', Path: 'path', Size: 'size', ModTime: 'time' };

        function initSortHandlers() {
            const headers = document.querySelectorAll('th.sortable');
            headers.forEach(th => {
                th.addEventListener('click', () => {
                    const field = th.dataset.sort;
                    sortResults(field);
                });
            });
        }
        
        function sortResults(displayField) {
            const serverField = SORT_FIELD_MAP[displayField] || displayField.toLowerCase();
            if (currentSort.field === serverField) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.field = serverField;
                currentSort.direction = 'asc';
            }
            currentSort.display = displayField;
            // Content-search matches keep file order; only path searches sort.
            updateSortIndicators();
            if (!document.getElementById('contentMode').checked) {
                search(); // re-run with server-side sort (applies across all pages)
            }
        }
        
        function updateSortIndicators() {
            // Remove all sort classes
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
            });
            
            // Add current sort class
            if (currentSort.field) {
                const th = document.querySelector(`th[data-sort="${currentSort.display}"]`);
                if (th) {
                    th.classList.add(`sort-${currentSort.direction}`);
                }
            }
        }
        
        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            const target = e.target;
            const typing = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
            if (typing) {
                if (e.key === 'Escape') {
                    target.blur();
                    searchInput.focus();
                    e.preventDefault();
                }
                return;
            }
            switch (e.key) {
                case '/':
                    searchInput.focus();
                    e.preventDefault();
                    break;
                case 'PageDown':
                    if (!document.getElementById('nextPageBtn').disabled) nextPage();
                    e.preventDefault();
                    break;
                case 'PageUp':
                    if (!document.getElementById('prevPageBtn').disabled) prevPage();
                    e.preventDefault();
                    break;
                case 'Home':
                    if (!document.getElementById('firstPageBtn').disabled) goFirstPage();
                    break;
                case 'End':
                    if (!document.getElementById('lastPageBtn').disabled) goLastPage();
                    break;
                case 'g':
                    document.getElementById('pageJump').focus();
                    break;
            }
        });
        
        // Search Functions
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                search();
            }, debounceDelay);
        });
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                clearTimeout(debounceTimer);
                search();
            }
        });
        
        async function search() {
            const query = searchInput.value.trim();
            if (!query) {
                resultsBody.innerHTML = '<tr><td colspan="6" class="empty-state">' + t('emptyStart') + '</td></tr>';
                resultsCount.textContent = '';
                exportButtons.style.display = 'none';
                document.getElementById('paginationControls').style.display = 'none';
                currentResults = [];
                currentMatches = [];
                currentPage = 1;
                return;
            }
            
            // New query resets to page 1
            if (query !== lastQuery) {
                lastQuery = query;
                currentPage = 1;
            }
            
            resultsBody.innerHTML = '<tr><td colspan="6" class="status">' + t('searching') + '</td></tr>';
            
            const ignoreCase = document.getElementById('ignoreCase').checked;
            const basename = document.getElementById('basenameMode').checked;
            const patternMode = document.getElementById('patternMode').value;
            const regexMode = document.getElementById('regexMode').checked || patternMode === 'regex';
            const contentMode = document.getElementById('contentMode').checked;
            const dedupe = document.getElementById('dedupeMode').checked;
            const scope = document.getElementById('scopeInput').value.trim();
            const types = document.getElementById('typeInput').value.trim();
            const exclude = document.getElementById('excludeInput').value.trim();
            const minSize = document.getElementById('minSizeInput').value;
            const maxSize = document.getElementById('maxSizeInput').value;
            const maxResults = document.getElementById('maxResults').value;
            const pageSize = parseInt(maxResults) || 100;
            const offset = (currentPage - 1) * pageSize;
            
            try {
                let url = '/api/search?q=' + encodeURIComponent(query) + 
                    '&ignore_case=' + ignoreCase + '&regex=' + regexMode +
                    '&pattern_mode=' + encodeURIComponent(patternMode) +
                    '&basename=' + basename +
                    '&dedupe=' + dedupe +
                    '&scope=' + encodeURIComponent(scope) +
                    '&type=' + encodeURIComponent(types) +
                    '&exclude=' + encodeURIComponent(exclude) +
                    '&min_size=' + minSize + '&max_size=' + maxSize +
                    '&limit=' + pageSize + '&offset=' + offset;
                if (contentMode) {
                    url += '&content=' + encodeURIComponent(query);
                }
                if (currentSort.field && !contentMode) {
                    url += '&sort_field=' + currentSort.field + '&sort_order=' + currentSort.direction;
                }
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    resultsBody.innerHTML = '<tr><td colspan="6" class="error">' + t('errPrefix') + ': ' + escapeHtml(data.error) + '</td></tr>';
                    resultsCount.textContent = '';
                    exportButtons.style.display = 'none';
                    currentResults = [];
                    currentMatches = [];
                    return;
                }
                
                if ((!data.results || data.results.length === 0) && (!data.matches || data.matches.length === 0)) {
                    resultsBody.innerHTML = '<tr><td colspan="6" class="empty-state">' + t('noResults') + '</td></tr>';
                    resultsCount.textContent = '无结果';
                    exportButtons.style.display = 'none';
                    document.getElementById('paginationControls').style.display = 'none';
                    currentResults = [];
                    currentMatches = [];
                    return;
                }
                
                // Save to search history
                saveSearchHistory(query);
                
                // Store results for export and sorting
                currentResults = data.results || [];
                currentMatches = data.matches || [];
                currentTotal = data.total || currentResults.length || currentMatches.length;
                
                // Reset sort
                currentSort = { field: null, direction: 'asc' };
                updateSortIndicators();
                
                // Render results
                renderResults();
                const shown = Math.max(currentResults.length, currentMatches.length);
                resultsCount.textContent = t('resultsFound') + ' ' + shown + ' (' + t('resultsTotal') + ' ' + currentTotal + ')';
                exportButtons.style.display = 'flex';
                updatePagination();
            } catch (err) {
                resultsBody.innerHTML = '<tr><td colspan="6" class="error">' + t('errPrefix') + ': ' + escapeHtml(err.message) + '</td></tr>';
                resultsCount.textContent = '';
                exportButtons.style.display = 'none';
                currentResults = [];
                currentMatches = [];
            }
        }
        
        // Pagination Functions
        function updatePagination() {
            const pageSize = parseInt(document.getElementById('maxResults').value) || 100;
            const totalPages = currentTotal > 0 ? Math.ceil(currentTotal / pageSize) : 1;
            const controls = document.getElementById('paginationControls');
            if (currentTotal === 0) {
                controls.style.display = 'none';
                return;
            }
            controls.style.display = 'flex';
            document.getElementById('pageInfo').textContent = t('pageInfo') + ' ' + currentPage + '/' + totalPages;
            document.getElementById('firstPageBtn').disabled = currentPage <= 1;
            document.getElementById('prevPageBtn').disabled = currentPage <= 1;
            document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
            document.getElementById('lastPageBtn').disabled = currentPage >= totalPages;
        }
        
        function goFirstPage() {
            if (currentPage <= 1) return;
            currentPage = 1;
            search();
        }
        
        function goLastPage() {
            const pageSize = parseInt(document.getElementById('maxResults').value) || 100;
            const totalPages = currentTotal > 0 ? Math.ceil(currentTotal / pageSize) : 1;
            if (currentPage >= totalPages) return;
            currentPage = totalPages;
            search();
        }
        
        function jumpToPage() {
            const pageSize = parseInt(document.getElementById('maxResults').value) || 100;
            const totalPages = currentTotal > 0 ? Math.ceil(currentTotal / pageSize) : 1;
            const n = parseInt(document.getElementById('pageJump').value);
            if (!n || n < 1 || n > totalPages) return;
            if (n === currentPage) return;
            currentPage = n;
            search();
        }
        
        function prevPage() {
            if (currentPage <= 1) return;
            currentPage--;
            search();
        }
        
        function nextPage() {
            currentPage++;
            search();
        }
        
        function renderResults() {
            if ((!currentResults || currentResults.length === 0) && (!currentMatches || currentMatches.length === 0)) return;
            
            const contentMode = currentMatches && currentMatches.length > 0;
            const count = Math.max(currentResults.length, currentMatches.length);
            
            let html = '';
            for (let i = 0; i < count; i++) {
                const result = currentResults[i] || {};
                const match = contentMode ? (currentMatches[i] || {}) : null;
                const modTime = result.ModTime ? formatDate(result.ModTime) : '-';
                const size = result.Size ? formatSize(result.Size) : '-';
                
                let matchCell = '-';
                let matchTitle = '';
                if (match) {
                    const lineNo = t('linePrefix') + (match.LineNum || '') + ': ';
                    matchCell = lineNo + highlightMatch(match.Line || '', match.Match);
                    const ctx = [];
                    (match.Before || []).forEach(l => ctx.push('↑ ' + l));
                    ctx.push(match.Line || '');
                    (match.After || []).forEach(l => ctx.push('↓ ' + l));
                    matchTitle = ctx.join('\n');
                }
                
                html += '<tr>';
                html += '<td class="col-name" title="' + escapeHtml(result.Name || '') + '">' + escapeHtml(result.Name || '-') + '</td>';
                html += '<td class="col-path" title="' + escapeHtml(result.Path || '') + '">' + highlightMatch(result.Path || '-', searchInput.value.trim()) + '</td>';
                html += '<td class="col-size">' + size + '</td>';
                html += '<td class="col-modtime">' + modTime + '</td>';
                html += '<td class="col-match" title="' + escapeHtml(matchTitle || matchCell) + '">' + matchCell + '</td>';
                html += '<td class="col-actions">' +
                    '<button onclick="openResult(' + i + ')">' + t('open') + '</button>' +
                    '<button onclick="openDirResult(' + i + ')">' + t('openDir') + '</button>' +
                    '<button onclick="copyResult(' + i + ')">' + t('copy') + '</button>' +
                    '<button onclick="toggleFavorite(' + i + ')" id="fav-' + i + '" title="' + t('favorite') + '">☆</button>' +
                    '</td>';
                html += '</tr>';
            }
            
            resultsBody.innerHTML = html;
        }
        
        // Path actions: open via the daemon, or copy to clipboard (browser).
        function resultPathAt(i) {
            const result = currentResults[i] || {};
            const match = currentMatches && currentMatches[i] || {};
            return result.Path || match.Path || '';
        }

        function dirnameOf(path) {
            const i = path.lastIndexOf('/');
            return i > 0 ? path.slice(0, i) : '';
        }

        async function openDirResult(i) {
            const dir = dirnameOf(resultPathAt(i));
            if (!dir) { alert(t('noDirToOpen')); return; }
            try {
                const r = await fetch('/api/open', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: dir })
                });
                if (!r.ok) { alert(t('openFail') + ': ' + (await r.text())); return; }
                const data = await r.json();
                alert(t('opened') + ': ' + data.path);
            } catch (err) {
                alert(t('openFail') + ': ' + err.message);
            }
        }

        async function openResult(i) {
            const path = resultPathAt(i);
            if (!path) { alert('无路径可打开'); return; }
            try {
                const r = await fetch('/api/open', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: path })
                });
                if (!r.ok) {
                    alert('打开失败: ' + (await r.text()));
                    return;
                }
                const data = await r.json();
                recordRecent(data.path);
                alert(t('opened') + ': ' + data.path);
            } catch (err) {
                alert('打开失败: ' + err.message);
            }
        }

        async function copyResult(i) {
            const path = resultPathAt(i);
            if (!path) { alert('无路径可复制'); return; }
            try {
                await navigator.clipboard.writeText(path);
                alert('已复制路径: ' + path);
            } catch (err) {
                // Clipboard API unavailable (e.g. non-secure context): fall back
                // to a temporary textarea + execCommand.
                try {
                    const ta = document.createElement('textarea');
                    ta.value = path;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    alert('已复制路径: ' + path);
                } catch (err2) {
                    alert('复制失败: ' + err2.message);
                }
            }
        }
        
        // ---- Favorites (localStorage bookmarks) ----
        let favoritePaths = [];
        function loadFavorites() {
            try { favoritePaths = JSON.parse(localStorage.getItem('golocateFavorites') || '[]'); }
            catch (e) { favoritePaths = []; }
        }
        function saveFavorites() {
            localStorage.setItem('golocateFavorites', JSON.stringify(favoritePaths));
            const favBtn = document.getElementById('favBtn');
            if (favBtn) favBtn.textContent = '⭐ ' + t('favorites') + (favoritePaths.length ? ' (' + favoritePaths.length + ')' : '');
        }
        function isFavorite(path) { return favoritePaths.some(f => f.path === path); }
        function toggleFavorite(i) {
            const path = resultPathAt(i);
            if (!path) return;
            loadFavorites();
            const idx = favoritePaths.findIndex(f => f.path === path);
            if (idx >= 0) { favoritePaths.splice(idx, 1); } else {
                favoritePaths.unshift({ path: path, name: (currentResults[i] || {}).Name || path.split('/').pop(), time: Date.now() });
            }
            saveFavorites();
            const btn = document.getElementById('fav-' + i);
            if (btn) btn.textContent = idx >= 0 ? '☆' : '★';
        }
        function renderFavorites() {
            loadFavorites();
            const list = document.getElementById('favList');
            list.innerHTML = '';
            if (favoritePaths.length === 0) {
                list.innerHTML = '<div style="color:#888; font-size:0.85em;">' + t('noFavorites') + '</div>';
                return;
            }
            favoritePaths.forEach((f, i) => {
                const row = document.createElement('div');
                row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; gap:8px; background:#1a1a1a; border:1px solid #333; border-radius:4px; padding:6px 10px; margin-bottom:4px;';
                const span = document.createElement('span');
                span.textContent = f.name + ' — ' + f.path;
                span.style.cssText = 'font-family:monospace; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; cursor:pointer;';
                span.title = f.path;
                span.onclick = () => openPath(f.path);
                const del = document.createElement('button');
                del.textContent = t('delete');
                del.style.cssText = 'padding:2px 8px; font-size:0.8em; background:#c0392b;';
                del.onclick = () => { favoritePaths.splice(i, 1); saveFavorites(); renderFavorites(); };
                row.appendChild(span);
                row.appendChild(del);
                list.appendChild(row);
            });
        }
        function toggleFavPanel() {
            const panel = document.getElementById('favPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            if (panel.style.display === 'block') { renderFavorites(); renderRecents(); }
        }
        // ---- Recent files (last opened) ----
        function recordRecent(path) {
            if (!path) return;
            let recents = [];
            try { recents = JSON.parse(localStorage.getItem('golocateRecent') || '[]'); } catch (e) { recents = []; }
            recents = recents.filter(r => r.path !== path);
            recents.unshift({ path: path, name: path.split('/').pop(), time: Date.now() });
            recents = recents.slice(0, 10);
            localStorage.setItem('golocateRecent', JSON.stringify(recents));
        }
        function renderRecents() {
            const list = document.getElementById('recentList');
            list.innerHTML = '';
            let recents = [];
            try { recents = JSON.parse(localStorage.getItem('golocateRecent') || '[]'); } catch (e) { recents = []; }
            if (recents.length === 0) {
                list.innerHTML = '<div style="color:#888; font-size:0.85em;">' + t('noRecent') + '</div>';
                return;
            }
            recents.forEach((f, i) => {
                const row = document.createElement('div');
                row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; gap:8px; background:#1a1a1a; border:1px solid #333; border-radius:4px; padding:6px 10px; margin-bottom:4px;';
                const span = document.createElement('span');
                span.textContent = f.name + ' — ' + f.path;
                span.style.cssText = 'font-family:monospace; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; cursor:pointer;';
                span.title = f.path;
                span.onclick = () => openPath(f.path);
                const del = document.createElement('button');
                del.textContent = '×';
                del.style.cssText = 'padding:2px 8px; font-size:0.8em; background:#555;';
                del.onclick = () => { recents.splice(i, 1); localStorage.setItem('golocateRecent', JSON.stringify(recents)); renderRecents(); };
                row.appendChild(span);
                row.appendChild(del);
                list.appendChild(row);
            });
        }
        async function openPath(path) {
            if (!path) { alert(t('noDirToOpen')); return; }
            try {
                const r = await fetch('/api/open', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: path })
                });
                if (!r.ok) { alert(t('openFail') + ': ' + (await r.text())); return; }
            } catch (err) {
                alert(t('openFail') + ': ' + err.message);
            }
        }
        
        // highlightMatch escapes text and wraps each occurrence of `match` in <mark>.
        function highlightMatch(text, match) {
            if (!match) return escapeHtml(text);
            const parts = String(text).split(match);
            if (parts.length === 1) return escapeHtml(text);
            return parts.map((p, i) =>
                i < parts.length - 1 ? escapeHtml(p) + '<mark>' + escapeHtml(match) + '</mark>' : escapeHtml(p)
            ).join('');
        }
        
        // Search History Functions
        function saveSearchHistory(query) {
            const history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            const filtered = history.filter(item => item.query !== query);
            filtered.unshift({ query: query, timestamp: Date.now() });
            const trimmed = filtered.slice(0, 20);
            localStorage.setItem('searchHistory', JSON.stringify(trimmed));
            loadSearchHistory();
        }
        
        function loadSearchHistory() {
            const history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            
            if (history.length === 0) {
                searchHistoryContainer.style.display = 'none';
                return;
            }
            
            searchHistoryContainer.style.display = 'block';
            searchHistoryItems.innerHTML = '';
            
            history.slice(0, 10).forEach(item => {
                const div = document.createElement('div');
                div.className = 'search-history-item';
                div.textContent = item.query;
                div.onclick = () => {
                    searchInput.value = item.query;
                    search();
                };
                searchHistoryItems.appendChild(div);
            });
        }
        
        // Export Functions
        // Exports fetch the FULL result set (up to 100000) so the file is not
        // limited to the currently displayed page.
        async function exportResults(format) {
            const query = lastQuery;
            if (!query && currentResults.length === 0 && currentMatches.length === 0) {
                alert('无结果可导出');
                return;
            }
            // Re-run the search without pagination to get everything.
            const ignoreCase = document.getElementById('ignoreCase').checked;
            const basename = document.getElementById('basenameMode').checked;
            const patternMode = document.getElementById('patternMode').value;
            const regexMode = document.getElementById('regexMode').checked || patternMode === 'regex';
            const contentMode = document.getElementById('contentMode').checked;
            const dedupe = document.getElementById('dedupeMode').checked;
            const scope = document.getElementById('scopeInput').value.trim();
            const types = document.getElementById('typeInput').value.trim();
            const exclude = document.getElementById('excludeInput').value.trim();
            const minSize = document.getElementById('minSizeInput').value;
            const maxSize = document.getElementById('maxSizeInput').value;

            let url = '/api/search?q=' + encodeURIComponent(query) +
                '&ignore_case=' + ignoreCase + '&regex=' + regexMode +
                '&pattern_mode=' + encodeURIComponent(patternMode) +
                '&basename=' + basename + '&dedupe=' + dedupe +
                    '&scope=' + encodeURIComponent(scope) +
                    '&type=' + encodeURIComponent(types) +
                    '&exclude=' + encodeURIComponent(exclude) +
                    '&min_size=' + minSize + '&max_size=' + maxSize +
                    '&limit=100000&offset=0';
            if (contentMode) {
                url += '&content=' + encodeURIComponent(query);
            }
            let data;
            try {
                const r = await fetch(url);
                data = await r.json();
            } catch (err) {
                alert('导出失败: ' + err.message);
                return;
            }
            if (data.error) {
                alert('导出失败: ' + data.error);
                return;
            }

            const allResults = data.results || [];
            const allMatches = data.matches || [];
            const useMatches = allMatches.length > 0;
            if (allResults.length === 0 && !useMatches) {
                alert('无结果可导出');
                return;
            }
            
            let content, filename, mimeType;
            
            if (useMatches) {
                switch (format) {
                    case 'json':
                        content = JSON.stringify(allMatches, null, 2);
                        filename = 'search_results.json';
                        mimeType = 'application/json';
                        break;
                    case 'csv':
                        content = '文件名,路径,行号,匹配内容\n' + allMatches.map(m => 
                            `"${(m.Path || '').split('/').pop()}","${m.Path || ''}","${m.LineNum || ''}","${(m.Line || '').replace(/"/g, '""')}"`
                        ).join('\n');
                        filename = 'search_results.csv';
                        mimeType = 'text/csv';
                        break;
                    case 'txt':
                        content = allMatches.map(m => `${m.Path}:${m.LineNum}:${m.Line}`).join('\n');
                        filename = 'search_results.txt';
                        mimeType = 'text/plain';
                        break;
                }
            } else {
                switch (format) {
                    case 'json':
                        content = JSON.stringify(allResults, null, 2);
                        filename = 'search_results.json';
                        mimeType = 'application/json';
                        break;
                    case 'csv':
                        content = '文件名,路径,大小,修改时间\n' + allResults.map(r => 
                            `"${r.Name || ''}","${r.Path || ''}","${formatSize(r.Size)}","${formatDate(r.ModTime)}"`
                        ).join('\n');
                        filename = 'search_results.csv';
                        mimeType = 'text/csv';
                        break;
                    case 'txt':
                        content = allResults.map(r => r.Path).join('\n');
                        filename = 'search_results.txt';
                        mimeType = 'text/plain';
                        break;
                }
            }
            
            const blob = new Blob([content], { type: mimeType });
            const urlObj = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = urlObj;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(urlObj);
        }
        
        // Utility Functions
        function formatSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            try {
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return '-';
                // 零值时间（文件不存在或 stat 失败时 ModTime 为 0001 年）显示为 -
                if (date.getFullYear() < 1000) return '-';
                
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');
                
                return `${year}-${month}-${day} ${hour}:${minute}`;
            } catch (e) {
                return '-';
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Server configuration edit
        function toSimpleYaml(obj) {
            let out = '';
            for (const k in obj) {
                const v = obj[k];
                if (Array.isArray(v)) {
                    out += k + ':';
                    if (v.length === 0) { out += ' []\n'; continue; }
                    out += '\n';
                    v.forEach(x => { out += '  - ' + x + '\n'; });
                } else {
                    out += k + ': ' + v + '\n';
                }
            }
            return out;
        }
        
        async function loadServerConfig() {
            try {
                const r = await fetch('/api/config');
                const cfg = await r.json();
                document.getElementById('serverConfigArea').value = toSimpleYaml(cfg);
                renderDirList(cfg.directories || []);
            } catch (err) {
                alert('加载配置失败: ' + err.message);
            }
        }

        // ---- Index directory management ----
        let currentDirs = [];

        function renderDirList(dirs) {
            currentDirs = dirs.slice();
            const box = document.getElementById('dirList');
            box.innerHTML = '';
            if (dirs.length === 0) {
                box.innerHTML = '<div style="color:#888; font-size:0.85em;">' + t('noDirs') + '</div>';
                return;
            }
            dirs.forEach((d, i) => {
                const row = document.createElement('div');
                row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; gap:8px; background:#1a1a1a; border:1px solid #333; border-radius:4px; padding:6px 10px; margin-bottom:4px;';
                const span = document.createElement('span');
                span.textContent = d;
                span.style.cssText = 'font-family:monospace; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;';
                const del = document.createElement('button');
                del.textContent = t('delete');
                del.style.cssText = 'padding:2px 8px; font-size:0.8em; background:#c0392b;';
                del.onclick = () => { currentDirs.splice(i, 1); renderDirList(currentDirs); };
                row.appendChild(span);
                row.appendChild(del);
                box.appendChild(row);
            });
        }

        function addDir() {
            const input = document.getElementById('newDirInput');
            const dir = input.value.trim();
            if (!dir) { alert('请输入目录路径'); return; }
            if (currentDirs.includes(dir)) { alert('目录已存在'); return; }
            currentDirs.push(dir);
            input.value = '';
            renderDirList(currentDirs);
        }

        // applyDirsToConfig rewrites the `directories:` block of the YAML in
        // the config textarea with the current directory list, then refreshes
        // the textarea so "保存配置" applies it server-side.
        function applyDirsToConfig() {
            let yaml = document.getElementById('serverConfigArea').value.trim();
            if (!yaml) { alert('请先「加载配置」'); return; }
            const block = 'directories:\n' + currentDirs.map(d => '  - ' + d).join('\n');
            // Match the whole `directories:` block (header + all `- item`
            // lines, including their trailing newline) and replace it.
            const re = /^directories:\n((?:[ \t]+- .*\n?)*)/m;
            if (re.test(yaml)) {
                yaml = yaml.replace(re, block + '\n');
            } else {
                yaml = block + '\n' + yaml;
            }
            document.getElementById('serverConfigArea').value = yaml;
            alert('已写入配置(directories)，点「保存配置」生效');
        }
        
        async function saveServerConfig() {
            const yaml = document.getElementById('serverConfigArea').value;
            if (!yaml.trim()) { alert('配置为空'); return; }
            try {
                const r = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ yaml: yaml })
                });
                if (!r.ok) {
                    alert('保存失败: ' + (await r.text()));
                    return;
                }
                alert('配置已保存');
            } catch (err) {
                alert('保存失败: ' + err.message);
            }
        }
    </script>
</body>
