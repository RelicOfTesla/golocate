<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>golocate - Fast File Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; color: #e0e0e0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { color: #4CAF50; margin-bottom: 20px; }
        
        /* Search Box */
        .search-box { display: flex; gap: 10px; margin-bottom: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #333; border-radius: 4px; background: #2a2a2a; color: #e0e0e0; font-size: 16px; }
        input[type="text"]:focus { outline: none; border-color: #4CAF50; }
        button { padding: 12px 24px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        
        /* Advanced Options */
        .advanced-options { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        .advanced-options label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .advanced-options input[type="checkbox"] { width: 16px; height: 16px; }
        .advanced-options input[type="number"] { width: 80px; padding: 5px; border: 1px solid #333; border-radius: 4px; background: #2a2a2a; color: #e0e0e0; }
        
        /* Search History */
        .search-history { margin-bottom: 15px; }
        .search-history-title { color: #888; font-size: 0.9em; margin-bottom: 5px; }
        .search-history-items { display: flex; gap: 8px; flex-wrap: wrap; }
        .search-history-item { padding: 4px 10px; background: #333; border-radius: 12px; font-size: 0.85em; cursor: pointer; transition: background 0.2s; }
        .search-history-item:hover { background: #444; }
        
        /* Results */
        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .results { background: #2a2a2a; border-radius: 4px; padding: 20px; }
        .result-item { padding: 10px; border-bottom: 1px solid #333; }
        .result-item:last-child { border-bottom: none; }
        .result-path { color: #4CAF50; font-family: monospace; }
        .result-name { color: #e0e0e0; font-weight: bold; }
        .result-size { color: #888; font-size: 0.9em; }
        .status { color: #888; font-size: 0.9em; margin-top: 10px; }
        .error { color: #f44336; }
        .searching { opacity: 0.6; }
        
        /* Export Buttons */
        .export-buttons { display: flex; gap: 8px; }
        .export-buttons button { padding: 6px 12px; font-size: 0.85em; background: #555; }
        .export-buttons button:hover { background: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 golocate</h1>
        
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>🔍 golocate</h1>
            <button class="secondary" onclick="toggleSettings()">⚙️ 设置</button>
        </div>
        
        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel" style="display: none; background: #2a2a2a; padding: 20px; border-radius: 4px; margin-bottom: 15px;">
            <h3 style="margin-bottom: 15px; color: #4CAF50;">设置</h3>
            <div style="display: grid; gap: 15px;">
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    <span>默认最大结果数:</span>
                    <input type="number" id="defaultLimit" value="100" min="1" max="10000" style="width: 100px; padding: 5px; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; border-radius: 4px;">
                </label>
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    <span>默认忽略大小写:</span>
                    <input type="checkbox" id="defaultIgnoreCase" checked>
                </label>
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    <span>主题:</span>
                    <select id="themeSelect" style="padding: 5px; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; border-radius: 4px;">
                        <option value="dark">暗色</option>
                        <option value="light">亮色</option>
                    </select>
                </label>
                <button onclick="saveSettings()" style="margin-top: 10px;">保存设置</button>
            </div>
        </div>
        
        <!-- Search Box -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search files..." autofocus>
            <button onclick="search()">Search</button>
        </div>
        
        <!-- Advanced Options -->
        <div class="advanced-options">
            <label>
                <input type="checkbox" id="ignoreCase" checked> 忽略大小写
            </label>
            <label>
                <input type="checkbox" id="regexMode"> 正则表达式
            </label>
            <label>
                最大结果数: <input type="number" id="maxResults" value="100" min="1" max="10000">
            </label>
        </div>
        
        <!-- Search History -->
        <div class="search-history" id="searchHistoryContainer" style="display: none;">
            <div class="search-history-title">最近搜索:</div>
            <div class="search-history-items" id="searchHistoryItems"></div>
        </div>
        
        <!-- Results -->
        <div class="results-header">
            <div id="resultsCount"></div>
            <div class="export-buttons" id="exportButtons" style="display: none;">
                <button onclick="exportResults('json')">导出 JSON</button>
                <button onclick="exportResults('csv')">导出 CSV</button>
                <button onclick="exportResults('txt')">导出 TXT</button>
            </div>
        </div>
        <div class="results" id="results">
            <p class="status">Start typing to search...</p>
        </div>
    </div>
    
    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');
        const resultsCount = document.getElementById('resultsCount');
        const exportButtons = document.getElementById('exportButtons');
        const searchHistoryContainer = document.getElementById('searchHistoryContainer');
        const searchHistoryItems = document.getElementById('searchHistoryItems');
        
        let debounceTimer = null;
        const DEBOUNCE_DELAY = 300; // 300ms delay
        let currentResults = [];
        
        // Load search history on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadSearchHistory();
            loadSettings();
        });
        
        // Settings Functions
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }
        
        function saveSettings() {
            const settings = {
                defaultLimit: document.getElementById('defaultLimit').value,
                defaultIgnoreCase: document.getElementById('defaultIgnoreCase').checked,
                theme: document.getElementById('themeSelect').value
            };
            localStorage.setItem('golocateSettings', JSON.stringify(settings));
            alert('设置已保存');
            applySettings(settings);
        }
        
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('golocateSettings') || '{}');
            if (settings.defaultLimit) {
                document.getElementById('defaultLimit').value = settings.defaultLimit;
                document.getElementById('maxResults').value = settings.defaultLimit;
            }
            if (settings.defaultIgnoreCase !== undefined) {
                document.getElementById('defaultIgnoreCase').checked = settings.defaultIgnoreCase;
                document.getElementById('ignoreCase').checked = settings.defaultIgnoreCase;
            }
            if (settings.theme) {
                document.getElementById('themeSelect').value = settings.theme;
                applySettings(settings);
            }
        }
        
        function applySettings(settings) {
            // Theme would be applied here
            // For now, just store it
        }
        
        // Debounced search on input
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                search();
            }, DEBOUNCE_DELAY);
        });
        
        // Also search on Enter
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                clearTimeout(debounceTimer);
                search();
            }
        });
        
        async function search() {
            const query = searchInput.value.trim();
            if (!query) {
                resultsDiv.innerHTML = '<p class="status">Start typing to search...</p>';
                resultsCount.textContent = '';
                exportButtons.style.display = 'none';
                return;
            }
            
            resultsDiv.innerHTML = '<p class="status">Searching...</p>';
            
            // Get advanced options
            const ignoreCase = document.getElementById('ignoreCase').checked;
            const maxResults = document.getElementById('maxResults').value;
            
            try {
                const response = await fetch('/api/search?q=' + encodeURIComponent(query) + 
                    '&ignore_case=' + ignoreCase + '&limit=' + maxResults);
                const data = await response.json();
                
                if (data.error) {
                    resultsDiv.innerHTML = '<p class="error">Error: ' + data.error + '</p>';
                    resultsCount.textContent = '';
                    exportButtons.style.display = 'none';
                    return;
                }
                
                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = '<p class="status">No results found</p>';
                    resultsCount.textContent = 'No results';
                    exportButtons.style.display = 'none';
                    return;
                }
                
                // Save to search history
                saveSearchHistory(query);
                
                // Store results for export
                currentResults = data.results;
                
                // Display results
                let html = '';
                data.results.forEach(result => {
                    html += '<div class="result-item">';
                    html += '<div class="result-path">' + escapeHtml(result.Path) + '</div>';
                    html += '<div class="result-name">' + escapeHtml(result.Name) + '</div>';
                    html += '<div class="result-size">' + formatSize(result.Size) + '</div>';
                    html += '</div>';
                });
                
                resultsDiv.innerHTML = html;
                resultsCount.textContent = 'Found ' + data.results.length + ' results';
                exportButtons.style.display = 'flex';
            } catch (err) {
                resultsDiv.innerHTML = '<p class="error">Error: ' + err.message + '</p>';
                resultsCount.textContent = '';
                exportButtons.style.display = 'none';
            }
        }
        
        // Search History Functions
        function saveSearchHistory(query) {
            const history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            
            // Remove duplicate
            const filtered = history.filter(item => item.query !== query);
            
            // Add new item
            filtered.unshift({
                query: query,
                timestamp: Date.now()
            });
            
            // Keep only last 20
            const trimmed = filtered.slice(0, 20);
            
            localStorage.setItem('searchHistory', JSON.stringify(trimmed));
            loadSearchHistory();
        }
        
        function loadSearchHistory() {
            const history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            
            if (history.length === 0) {
                searchHistoryContainer.style.display = 'none';
                return;
            }
            
            searchHistoryContainer.style.display = 'block';
            searchHistoryItems.innerHTML = '';
            
            history.slice(0, 10).forEach(item => {
                const div = document.createElement('div');
                div.className = 'search-history-item';
                div.textContent = item.query;
                div.onclick = () => {
                    searchInput.value = item.query;
                    search();
                };
                searchHistoryItems.appendChild(div);
            });
        }
        
        // Export Functions
        function exportResults(format) {
            if (!currentResults || currentResults.length === 0) {
                alert('No results to export');
                return;
            }
            
            let content, filename, mimeType;
            
            switch (format) {
                case 'json':
                    content = JSON.stringify(currentResults, null, 2);
                    filename = 'search_results.json';
                    mimeType = 'application/json';
                    break;
                case 'csv':
                    content = 'Path,Name,Size\n' + currentResults.map(r => 
                        `"${r.Path}","${r.Name}",${r.Size}`
                    ).join('\n');
                    filename = 'search_results.csv';
                    mimeType = 'text/csv';
                    break;
                case 'txt':
                    content = currentResults.map(r => r.Path).join('\n');
                    filename = 'search_results.txt';
                    mimeType = 'text/plain';
                    break;
            }
            
            // Download file
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Utility Functions
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
