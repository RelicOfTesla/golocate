name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Root module requires go >= 1.25 (see go.mod).
        go-version: '1.25.1'

    - name: Run tests
      run: go test ./...

    - name: Run go vet
      run: go vet ./...

    - name: Run h5 module tests
      run: (cd ui/h5 && go test ./...)

    - name: Run h5 module vet
      run: (cd ui/h5 && go vet ./...)

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.1'

    - name: Build golocated
      run: go build -o bin/golocated ./cmd/golocated/

    - name: Build golocate
      run: go build -o bin/golocate ./cmd/golocate/

    - name: Build golocate-h5
      run: (cd ui/h5 && go build -o ../../bin/golocate-h5 ./cmd/golocate-h5/)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.os }}
        path: bin/
